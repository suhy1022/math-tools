<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動式迴歸直線 (手機優化版)</title>
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f1f5f9; touch-action: manipulation; }
        
        /* 調整滑桿高度，方便手機觸控 */
        input[type=range] {
            height: 24px; 
            margin-top: 5px;
        }
        
        /* 統計卡片樣式 */
        .stat-card {
            background: #fff;
            padding: 8px 4px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            text-align: center;
            font-size: 0.85rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .stat-value { font-family: monospace; font-weight: bold; color: #2563eb; font-size: 1rem; }
        .stat-label { font-size: 0.75rem; color: #64748b; margin-bottom: 2px; }
    </style>
</head>
<body class="p-2 md:p-6">

    <div class="max-w-6xl mx-auto bg-white rounded-lg shadow-md p-3 md:p-6">
        <h1 class="text-xl md:text-2xl font-bold text-gray-800 text-center mb-2">互動式迴歸直線</h1>
        
        <div class="flex flex-col md:flex-row gap-4">
            
            <div class="w-full md:w-3/4 flex flex-col">
                <div id="plotDiv" class="w-full h-[300px] md:h-[500px] border border-gray-100 rounded-lg"></div>

                <div class="mt-2 bg-blue-50 p-3 rounded-lg border border-blue-100">
                    <div class="mb-3">
                        <label class="flex justify-between text-sm font-medium text-gray-700">
                            <span>斜率 \(m\)</span>
                            <span id="slopeVal" class="font-bold text-blue-600">1.00</span>
                        </label>
                        <input type="range" id="slope" min="-5" max="5" step="0.05" value="1" class="w-full cursor-pointer">
                    </div>

                    <div>
                        <label class="flex justify-between text-sm font-medium text-gray-700">
                            <span>截距 \(b\)</span>
                            <span id="interceptVal" class="font-bold text-green-600">0.00</span>
                        </label>
                        <input type="range" id="intercept" min="-10" max="20" step="0.1" value="0" class="w-full cursor-pointer">
                    </div>
                </div>
            </div>

            <div class="w-full md:w-1/4 flex flex-col gap-2">
                
                <div class="bg-gray-50 p-3 rounded-lg border border-gray-200 text-center">
                    <div class="text-sm text-gray-500">當前方程式</div>
                    <div class="font-mono text-indigo-700 font-bold text-lg mb-2" id="eqDisplay">y = ...</div>
                    
                    <div class="text-sm text-gray-500">SSE (誤差平方和)</div>
                    <div id="sseDisplay" class="font-mono font-bold text-red-600 text-xl">0.00</div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <button onclick="toggleBestFit()" class="px-2 py-2 bg-gray-200 hover:bg-gray-300 text-gray-800 rounded text-sm transition">
                        👀 顯示正解
                    </button>
                    <button onclick="generateData()" class="px-2 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded text-sm transition">
                        🎲 重來
                    </button>
                </div>
                
                <label class="flex items-center justify-center p-2 bg-gray-50 rounded cursor-pointer border border-gray-200">
                    <input type="checkbox" id="showResidualsCheck" class="w-4 h-4 text-blue-600" checked onchange="updatePlot()">
                    <span class="ml-2 text-sm text-gray-700">顯示誤差線段</span>
                </label>

                <h3 class="text-sm font-bold text-gray-400 mt-2 uppercase text-center">統計指標</h3>
                <div class="grid grid-cols-3 md:grid-cols-1 gap-2">
                    <div class="stat-card">
                        <div class="stat-label">\(\bar{x}\) / \(\bar{y}\)</div>
                        <div class="stat-value text-orange-500">
                            <span id="meanX">0</span>, <span id="meanY">0</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">\(\sigma_x\) / \(\sigma_y\)</div>
                        <div class="stat-value text-gray-600">
                            <span id="sdX">0</span>, <span id="sdY">0</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">\(r_{xy}\)</div>
                        <div id="corr" class="stat-value text-purple-600">0.00</div>
                    </div>
                    <div class="stat-card bg-blue-50 border-blue-200 col-span-3 md:col-span-1">
                        <div class="stat-label text-blue-800">理論斜率 \( r \frac{\sigma_y}{\sigma_x} \)</div>
                        <div id="calcSlope" class="stat-value text-blue-700">0.00</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 與之前相同的邏輯，這裡省略重複註解以保持簡潔
        let xData = [], yData = [];
        let showBestFit = false;
        let meanX=0, meanY=0, stdX=0, stdY=0, r_xy=0, theoreticalSlope=0;

        generateData();

        document.getElementById('slope').addEventListener('input', updatePlot);
        document.getElementById('intercept').addEventListener('input', updatePlot);

        function generateData() {
            xData = []; yData = [];
            let trueSlope = (Math.random() * 2.5 - 0.5).toFixed(2);
            let trueIntercept = (Math.random() * 8 + 2).toFixed(2);
            for (let i = 0; i < 15; i++) { // 手機版點數少一點較清爽
                let x = Math.random() * 10;
                let noise = (Math.random() - 0.5) * 4;
                xData.push(x);
                yData.push(parseFloat(trueSlope) * x + parseFloat(trueIntercept) + noise);
            }
            calculateStats();
            document.getElementById('slope').value = 1;
            document.getElementById('intercept').value = (meanY - meanX).toFixed(1);
            updatePlot();
        }

        function calculateStats() {
            const n = xData.length;
            const sumX = xData.reduce((a, b) => a + b, 0);
            const sumY = yData.reduce((a, b) => a + b, 0);
            meanX = sumX / n; meanY = sumY / n;
            const sumSqDiffX = xData.reduce((a, b) => a + Math.pow(b - meanX, 2), 0);
            const sumSqDiffY = yData.reduce((a, b) => a + Math.pow(b - meanY, 2), 0);
            stdX = Math.sqrt(sumSqDiffX / n); stdY = Math.sqrt(sumSqDiffY / n);
            const sumCrossDiff = xData.reduce((sum, xi, i) => sum + (xi - meanX) * (yData[i] - meanY), 0);
            r_xy = (sumCrossDiff / n) / (stdX * stdY);
            theoreticalSlope = r_xy * (stdY / stdX);
            
            document.getElementById('meanX').innerText = meanX.toFixed(1);
            document.getElementById('meanY').innerText = meanY.toFixed(1);
            document.getElementById('sdX').innerText = stdX.toFixed(1);
            document.getElementById('sdY').innerText = stdY.toFixed(1);
            document.getElementById('corr').innerText = r_xy.toFixed(2);
            document.getElementById('calcSlope').innerText = theoreticalSlope.toFixed(2);
        }

        function updatePlot() {
            let m = parseFloat(document.getElementById('slope').value);
            let b = parseFloat(document.getElementById('intercept').value);
            let showRes = document.getElementById('showResidualsCheck').checked;

            document.getElementById('slopeVal').innerText = m.toFixed(2);
            document.getElementById('interceptVal').innerText = b.toFixed(2);
            let bText = b >= 0 ? `+ ${b.toFixed(2)}` : `- ${Math.abs(b).toFixed(2)}`;
            document.getElementById('eqDisplay').innerText = `y = ${m.toFixed(2)}x ${bText}`;

            let xMin = Math.min(...xData) - 0.5;
            let xMax = Math.max(...xData) + 0.5;
            let sse = 0;
            let resX = [], resY = [];

            for(let i=0; i<xData.length; i++) {
                let predictedY = m * xData[i] + b;
                let error = yData[i] - predictedY;
                sse += error * error;
                if (showRes) {
                    resX.push(xData[i], xData[i], null);
                    resY.push(yData[i], predictedY, null);
                }
            }
            document.getElementById('sseDisplay').innerText = sse.toFixed(2);

            let traces = [];
            if (showRes) traces.push({ x: resX, y: resY, mode: 'lines', hoverinfo: 'skip', line: { color: 'rgba(255, 0, 0, 0.3)', width: 1 } });
            traces.push({ x: xData, y: yData, mode: 'markers', name: '數據點', marker: { size: 9, color: 'rgba(59, 130, 246, 0.6)' } });
            traces.push({ x: [meanX], y: [meanY], mode: 'markers', name: '平均點', marker: { size: 12, color: 'orange', symbol: 'star' } });
            traces.push({ x: [xMin, xMax], y: [m * xMin + b, m * xMax + b], mode: 'lines', name: '預測線', line: { color: 'rgb(30, 41, 59)', width: 3 } });

            if (showBestFit) {
                let bestIntercept = meanY - theoreticalSlope * meanX;
                traces.push({ x: [xMin, xMax], y: [theoreticalSlope * xMin + bestIntercept, theoreticalSlope * xMax + bestIntercept], mode: 'lines', name: '最佳直線', line: { color: 'rgba(34, 197, 94, 0.8)', width: 4, dash: 'dot' } });
            }

            // 版面與字體大小針對手機優化
            let layout = {
                margin: { t: 10, l: 30, r: 10, b: 30 },
                xaxis: { title: '', range: [0, 11], fixedrange: true }, // fixedrange 禁止縮放，避免手機誤觸
                yaxis: { title: '', range: [-5, 25], fixedrange: true },
                showlegend: false, // 手機版隱藏圖例以節省空間
                hovermode: 'closest'
            };

            Plotly.react('plotDiv', traces, layout, {displayModeBar: false});
        }
        
        function toggleBestFit() { showBestFit = !showBestFit; updatePlot(); }
    </script>
</body>
</html>
