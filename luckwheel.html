<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 平板與觸控螢幕最佳化：鎖定不必要縮放 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>幸運輪盤抽籤工具</title>

    <!-- iPadOS (Safari) 全螢幕 Web App 設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="幸運輪盤">

    <!-- Android (Chrome) 全螢幕 Web App 設定 -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#4f46e5">

    <!-- 內嵌 SVG 桌面圖示 (加入主畫面時顯示為繽紛輪盤 App 圖示) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234f46e5'/><text x='50%25' y='54%25' dominant-baseline='central' text-anchor='middle' font-size='64'>🎡</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234f46e5'/><text x='50%25' y='54%25' dominant-baseline='central' text-anchor='middle' font-size='64'>🎡</text></svg>">

    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- 引入 Google Fonts (Noto Sans TC & Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', '"Noto Sans TC"', 'sans-serif'],
                    },
                    animation: {
                        'bounce-short': 'bounce 0.5s ease-in-out 2',
                        'pop-in': 'popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
                    },
                    keyframes: {
                        popIn: {
                            '0%': { opacity: '0', transform: 'scale(0.8) translateY(10px)' },
                            '100%': { opacity: '1', transform: 'scale(1) translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* 自訂捲軸樣式 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* 輪盤指針陰影與微調 */
        .wheel-pointer {
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
            transition: transform 0.05s ease-out;
        }
        .pointer-tick {
            transform: rotate(-18deg);
        }

        /* 隱藏數字輸入框預設箭頭 */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* 避免平板連點兩下觸發畫面縮放 */
        button, select, input, textarea {
            touch-action: manipulation;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans selection:bg-indigo-500 selection:text-white overflow-x-hidden">

    <!-- 慶祝彩帶特效畫布 -->
    <canvas id="confettiCanvas" class="fixed inset-0 pointer-events-none z-50"></canvas>

    <!-- 班級管理與匯入/匯出 自訂互動彈窗 (不使用原生 alert/prompt) -->
    <div id="customModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-md w-full p-6 animate-pop-in">
            <div class="flex items-center justify-between mb-4">
                <h3 id="modalTitle" class="text-lg font-black text-slate-800 flex items-center gap-2">
                    <i id="modalIcon" class="fa-solid fa-folder-plus text-indigo-600"></i>
                    <span id="modalTitleText">新增班級</span>
                </h3>
                <button onclick="closeModal()" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <p id="modalDesc" class="text-sm text-slate-600 mb-4 leading-relaxed"></p>

            <!-- 單行文字輸入框 (新增/改名班級用) -->
            <div id="modalInputWrapper" class="mb-5 hidden">
                <input type="text" id="modalTextInput" placeholder="例如：高一 (2) 班" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-600 font-bold text-slate-800">
            </div>

            <!-- 多行 JSON 備份/還原輸入框 -->
            <div id="modalTextareaWrapper" class="mb-5 hidden">
                <textarea id="modalTextareaInput" rows="6" placeholder="請貼上備份的 JSON 資料..." class="w-full p-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-600 font-mono text-xs text-slate-700 bg-slate-50"></textarea>
            </div>

            <div class="flex items-center justify-end gap-2.5">
                <button onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-sm transition">
                    取消
                </button>
                <button id="modalConfirmBtn" class="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow-sm transition active:scale-95">
                    確認
                </button>
            </div>
        </div>
    </div>

    <!-- 頂部導覽列 -->
    <header class="bg-white border-b border-slate-200 shadow-xs sticky top-0 z-30">
        <div class="max-w-[1600px] mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-2">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-md shadow-indigo-200 shrink-0">
                    <i class="fa-solid fa-dharmachakra text-xl animate-spin" style="animation-duration: 12s;"></i>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="text-base sm:text-xl font-black tracking-tight text-slate-800">
                            幸運輪盤抽籤工具
                        </h1>
                        <span id="activeClassHeaderBadge" class="text-xs font-bold px-2.5 py-0.5 bg-indigo-50 text-indigo-700 rounded-full border border-indigo-200">
                            載入中...
                        </span>
                    </div>
                    <!-- 自動儲存狀態指示器 -->
                    <div class="flex items-center gap-1.5 text-[11px] text-emerald-600 font-semibold mt-0.5">
                        <i id="saveStatusIcon" class="fa-solid fa-cloud-arrow-up"></i>
                        <span id="saveStatusText">已自動儲存於本機 (localStorage)</span>
                    </div>
                </div>
            </div>

            <!-- 頂部快速資訊與控制按鈕 -->
            <div class="flex items-center space-x-2 sm:space-x-2.5">
                <!-- 快捷鍵提示 -->
                <div class="hidden xl:flex items-center text-xs text-slate-500 bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200 mr-1">
                    <span class="font-semibold text-slate-700 mr-1.5"><i class="fa-regular fa-keyboard mr-1"></i>快捷鍵：</span>
                    按 <kbd class="px-1.5 py-0.5 mx-1 bg-white rounded shadow-xs border border-slate-300 font-mono text-[11px]">Space</kbd> 開始抽籤
                </div>

                <!-- 音效開關 -->
                <button id="muteBtn" onclick="toggleMute()" class="flex items-center space-x-1.5 px-3 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-sm transition active:scale-95" title="切換音效">
                    <i id="muteIcon" class="fa-solid fa-volume-high text-indigo-600 w-4 text-center"></i>
                    <span id="muteText" class="hidden md:inline">音效開啟</span>
                </button>

                <!-- 重設本班按鈕 -->
                <button onclick="resetAll()" class="flex items-center space-x-1.5 px-3.5 py-2 rounded-xl bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-200/80 font-semibold text-sm transition active:scale-95 shadow-xs" title="將本班所有已抽中者加回輪盤並清空本班紀錄">
                    <i class="fa-solid fa-rotate-left"></i>
                    <span>重設本班紀錄</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主要內容區：三欄響應式佈局 -->
    <main class="flex-1 max-w-[1600px] w-full mx-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        
        <!-- 左欄：班級管理、名單管理與抽籤設定 (佔 3 欄) -->
        <section class="lg:col-span-3 flex flex-col gap-4 order-2 lg:order-1">
            
            <!-- 1. 多班級切換與管理卡片 (新增) -->
            <div class="bg-white rounded-2xl shadow-xs border border-slate-200/80 p-4 sm:p-5">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-chalkboard-user text-indigo-600"></i>
                        <span>班級名單切換</span>
                    </h2>
                    <div class="flex items-center gap-1">
                        <button onclick="openBackupModal()" class="text-[11px] font-semibold px-2 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 transition flex items-center gap-1" title="跨裝置匯出或匯入所有班級名單">
                            <i class="fa-solid fa-file-export"></i> 備份/匯入
                        </button>
                    </div>
                </div>

                <!-- 班級下拉選單 -->
                <div class="relative mb-2.5">
                    <select id="classSelectDropdown" onchange="switchClass(this.value)" class="w-full appearance-none bg-indigo-50/70 hover:bg-indigo-50 border border-indigo-200 text-indigo-950 font-extrabold text-sm rounded-xl px-3.5 py-2.5 pr-9 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition cursor-pointer">
                        <!-- 由 JS 動態填入班級選項 -->
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-indigo-600">
                        <i class="fa-solid fa-chevron-down text-xs"></i>
                    </div>
                </div>

                <!-- 班級管理操作按鈕列 -->
                <div class="grid grid-cols-3 gap-1.5">
                    <button onclick="promptAddClass()" class="py-1.5 px-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs transition flex items-center justify-center gap-1 shadow-xs active:scale-95">
                        <i class="fa-solid fa-plus"></i> 新增班級
                    </button>
                    <button onclick="promptRenameClass()" class="py-1.5 px-2 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs transition flex items-center justify-center gap-1 active:scale-95">
                        <i class="fa-solid fa-pen"></i> 改名
                    </button>
                    <button onclick="promptDeleteClass()" class="py-1.5 px-2 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-600 font-semibold text-xs transition flex items-center justify-center gap-1 active:scale-95">
                        <i class="fa-regular fa-trash-can"></i> 刪除班級
                    </button>
                </div>
            </div>

            <!-- 2. 抽籤規則設定卡片 -->
            <div class="bg-white rounded-2xl shadow-xs border border-slate-200/80 p-4 sm:p-5">
                <h2 class="text-base font-bold text-slate-800 mb-3.5 flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-indigo-600"></i>
                    <span>抽籤條件設定</span>
                </h2>

                <div class="space-y-4">
                    <!-- 每次抽選人數 (N) -->
                    <div>
                        <div class="flex justify-between items-center mb-1.5">
                            <label for="drawCountInput" class="text-sm font-semibold text-slate-700">每次抽選人數 (N)</label>
                            <span id="maxDrawHint" class="text-xs text-slate-400">上限: 36 人</span>
                        </div>
                        <div class="flex items-center">
                            <button onclick="adjustDrawCount(-1)" class="w-10 h-10 rounded-l-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold border border-r-0 border-slate-300 flex items-center justify-center transition active:bg-slate-300">
                                <i class="fa-solid fa-minus text-xs"></i>
                            </button>
                            <input type="number" id="drawCountInput" value="1" min="1" max="36" onchange="validateDrawCount()" class="w-full h-10 text-center font-bold text-lg text-indigo-600 border-y border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500/20">
                            <button onclick="adjustDrawCount(1)" class="w-10 h-10 rounded-r-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold border border-l-0 border-slate-300 flex items-center justify-center transition active:bg-slate-300">
                                <i class="fa-solid fa-plus text-xs"></i>
                            </button>
                        </div>
                        <!-- 快速人數選擇按鈕 -->
                        <div class="grid grid-cols-4 gap-1.5 mt-2">
                            <button onclick="setDrawCount(1)" class="py-1 text-xs font-medium rounded-lg bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-600 transition border border-transparent hover:border-indigo-200">1人</button>
                            <button onclick="setDrawCount(2)" class="py-1 text-xs font-medium rounded-lg bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-600 transition border border-transparent hover:border-indigo-200">2人</button>
                            <button onclick="setDrawCount(3)" class="py-1 text-xs font-medium rounded-lg bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-600 transition border border-transparent hover:border-indigo-200">3人</button>
                            <button onclick="setDrawCount(5)" class="py-1 text-xs font-medium rounded-lg bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-600 transition border border-transparent hover:border-indigo-200">5人</button>
                        </div>
                    </div>

                    <!-- 多人抽選模式 (當 N > 1 時顯示或隨時可切換) -->
                    <div id="multiModeContainer" class="pt-2 border-t border-slate-100">
                        <label class="text-sm font-semibold text-slate-700 block mb-2">多人抽選方式 (N &gt; 1 時)</label>
                        <div class="grid grid-cols-2 gap-2 p-1 bg-slate-100 rounded-xl">
                            <button id="modeSequentialBtn" onclick="setMultiDrawMode('sequential')" class="py-2 px-2 rounded-lg text-xs font-bold transition flex items-center justify-center gap-1.5 bg-white text-indigo-600 shadow-sm">
                                <i class="fa-solid fa-forward-step"></i> 連續轉動抽出
                            </button>
                            <button id="modeSimultaneousBtn" onclick="setMultiDrawMode('simultaneous')" class="py-2 px-2 rounded-lg text-xs font-bold transition flex items-center justify-center gap-1.5 text-slate-600 hover:text-slate-900">
                                <i class="fa-solid fa-bolt"></i> 一次同時抽出
                            </button>
                        </div>
                        <p id="multiModeDesc" class="text-[11px] text-slate-500 mt-1.5 leading-relaxed">
                            輪盤將自動連續旋轉 N 次，依序揭曉每位幸運兒。
                        </p>
                    </div>

                    <!-- 排除已抽中者 Toggle -->
                    <div class="pt-3 border-t border-slate-100 flex items-center justify-between">
                        <div>
                            <div class="text-sm font-semibold text-slate-700">排除已抽中者</div>
                            <div class="text-xs text-slate-400">抽中後自動從輪盤移除，不重複中獎</div>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="excludeWinnersToggle" class="sr-only peer" checked onchange="handleExcludeToggleChange()">
                            <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
                        </label>
                    </div>
                </div>
            </div>

            <!-- 3. 名單輸入與管理卡片 -->
            <div class="bg-white rounded-2xl shadow-xs border border-slate-200/80 p-4 sm:p-5 flex-1 flex flex-col">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-users text-indigo-600"></i>
                        <span>本班名單編輯</span>
                    </h2>
                    <span class="text-[11px] font-medium text-slate-400">修改後自動儲存</span>
                </div>

                <!-- 人數統計徽章 -->
                <div class="grid grid-cols-2 gap-2.5 mb-3">
                    <div class="bg-slate-50 border border-slate-200/80 rounded-xl p-2.5 flex items-center justify-between">
                        <span class="text-xs font-medium text-slate-500">本班總人數</span>
                        <span id="totalCountBadge" class="text-base font-black text-slate-800">0</span>
                    </div>
                    <div class="bg-indigo-50/70 border border-indigo-200/80 rounded-xl p-2.5 flex items-center justify-between">
                        <span class="text-xs font-medium text-indigo-600">輪盤剩餘人數</span>
                        <span id="remainingCountBadge" class="text-base font-black text-indigo-700">0</span>
                    </div>
                </div>

                <!-- 快速匯入按鈕組 -->
                <div class="flex flex-wrap gap-1.5 mb-3">
                    <button onclick="importPreset('36numbers')" class="flex-1 py-1.5 px-2.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold text-xs rounded-lg border border-indigo-200/60 transition flex items-center justify-center gap-1 whitespace-nowrap">
                        <i class="fa-solid fa-list-ol"></i> 載入 1~36 號
                    </button>
                    <button onclick="importPreset('sampleNames')" class="py-1.5 px-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium text-xs rounded-lg transition flex items-center justify-center gap-1 whitespace-nowrap">
                        <i class="fa-solid fa-user-check"></i> 範例姓名
                    </button>
                    <button onclick="clearNamesList()" class="py-1.5 px-2.5 bg-rose-50 hover:bg-rose-100 text-rose-600 font-medium text-xs rounded-lg transition flex items-center justify-center gap-1 whitespace-nowrap" title="清空本班所有名單">
                        <i class="fa-regular fa-trash-can"></i> 清空
                    </button>
                </div>

                <!-- 姓名輸入框 -->
                <div class="relative flex-1 flex flex-col">
                    <textarea 
                        id="namesTextarea" 
                        rows="8"
                        placeholder="請輸入本班抽籤名單，每行一個名字或座號...&#10;例如：&#10;01號 王小明&#10;02號 林小華"
                        oninput="handleNamesInput()"
                        class="w-full flex-1 p-3 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 focus:bg-white transition resize-y font-medium text-slate-700 leading-relaxed"
                    ></textarea>
                </div>

                <!-- 已排除名單小標籤展示 (支援點擊單一標籤加回輪盤) -->
                <div id="excludedPoolSection" class="hidden mt-3 pt-3 border-t border-slate-100">
                    <div class="flex items-center justify-between mb-1.5">
                        <span class="text-xs font-semibold text-slate-500 flex items-center gap-1" title="點擊下方個別標籤可單獨加回輪盤">
                            <i class="fa-solid fa-user-slash text-slate-400"></i> 已抽中排除 (<span id="excludedCountText">0</span>)
                        </span>
                        <button onclick="restoreExcludedWinners()" class="text-xs text-indigo-600 hover:text-indigo-800 font-semibold hover:underline">
                            全部加回輪盤
                        </button>
                    </div>
                    <div id="excludedTagsList" class="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto p-1">
                        <!-- 動態生成已排除標籤 -->
                    </div>
                </div>
            </div>

        </section>

        <!-- 中欄：互動幸運大輪盤 (佔 5 欄) -->
        <section class="lg:col-span-5 flex flex-col items-center justify-center order-1 lg:order-2 bg-white rounded-3xl shadow-sm border border-slate-200/80 p-4 sm:p-8 min-h-[460px] lg:min-h-[680px] relative overflow-hidden">
            
            <!-- 頂部狀態橫幅 -->
            <div class="w-full flex items-center justify-between mb-2 sm:mb-4 z-10">
                <div id="wheelStatusBadge" class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-200">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span>準備就緒，點擊中央按鈕開始</span>
                </div>
                <div id="currentPointerTarget" class="text-sm font-bold text-slate-600 bg-slate-100 px-3 py-1 rounded-full border border-slate-200 truncate max-w-[160px] sm:max-w-[220px]">
                    指標指向：--
                </div>
            </div>

            <!-- 輪盤容器 -->
            <div class="relative w-full max-w-[460px] aspect-square flex items-center justify-center my-auto">
                
                <!-- 外圈裝飾光暈 -->
                <div class="absolute inset-2 rounded-full bg-gradient-to-tr from-indigo-500/10 via-purple-500/10 to-amber-500/10 blur-xl pointer-events-none"></div>

                <!-- 輪盤畫布 -->
                <canvas id="wheelCanvas" class="w-full h-full relative z-10"></canvas>

                <!-- 右側固定指針 (指向 3 點鐘方向 / 0 度位置) -->

            <!-- 歷次抽籤紀錄列表 -->
            <div class="bg-white rounded-2xl shadow-xs border border-slate-200/80 p-5 flex-1 flex flex-col min-h-[340px]">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-clock-rotate-left text-indigo-600"></i>
                        <span>本班中獎紀錄</span>
                        <span id="historyTotalBadge" class="text-xs font-bold px-2 py-0.5 bg-slate-100 text-slate-600 rounded-full">0 輪</span>
                    </h2>

                    <div class="flex items-center gap-1.5">
                        <button onclick="copyWinnersHistory()" class="px-2.5 py-1.5 rounded-lg bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold text-xs transition flex items-center gap-1" title="複製本班所有中獎名單">
                            <i class="fa-regular fa-copy"></i>
                            <span>複製名單</span>
                        </button>
                        <button onclick="clearHistoryOnly()" class="p-1.5 rounded-lg bg-slate-100 hover:bg-rose-50 text-slate-500 hover:text-rose-600 text-xs transition" title="僅清空本班歷史紀錄">
                            <i class="fa-regular fa-trash-can"></i>

                <!-- 歷史紀錄容器 -->
                <div id="historyListContainer" class="flex-1 overflow-y-auto space-y-2.5 pr-1 max-h-[380px]">
                    <div class="h-full flex flex-col items-center justify-center text-slate-400 py-12 text-sm">
                        <i class="fa-regular fa-clipboard text-3xl mb-2 opacity-50"></i>
